name: CI-Mac

on:
  workflow_dispatch:
  push:
    # branches:
    # - master
    # Sequence of patterns matched against refs/tags
    tags:
      - '*' # Push events to matching any tags

permissions:
  contents: write

jobs:
  build:
    # 见 https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Use pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      # 获取package.json中的版本号, 方便后续处理
      - name: Read package.json
        id: get-version-from-package-json
        run: node scripts/release/write-package-version-output.cjs
      - name: Show version number
        run: echo "current version is ${{ steps.get-version-from-package-json.outputs.packageVersion }}"
      - name: Create corresponding source bundle
        run: >-
          node scripts/release/create-corresponding-source.cjs
          --output-dir "${{ runner.temp }}/zhihuhelp-source"
      # mac需要提前安装vips, 否则无法启动sharp构建
      # - run: brew install vips
      - run: pnpm install --frozen-lockfile
      # 只重建 sharp 即可
      - run: pnpm rebuild sharp
      # 尝试解决mac上无法构建的问题
      # - run: pnpm rebuild sharp
      # - run: electron-builder install-app-deps
      # - run: pnpm postinstall-4-mac
      - name: Verify pinned Pandoc runtime input
        run: node scripts/release/create-corresponding-source.cjs --verify-installed
      - run: pnpm build-without-sourcemap
      - name: Stage distribution license files
        run: node scripts/release/create-corresponding-source.cjs --stage-license-files dist/licenses
      - run: pnpm buildgui
      - run: pnpm electron-builder --publish never
        env:
          CI: true
      - name: Verify packaged Pandoc runtime
        run: node scripts/release/create-corresponding-source.cjs --verify-packaged release
      - name: Prepare release binary
        env:
          PACKAGE_VERSION: ${{ steps.get-version-from-package-json.outputs.packageVersion }}
          RELEASE_BINARY: ${{ runner.temp }}/mac-zhihuhelp-${{ steps.get-version-from-package-json.outputs.packageVersion }}.7z
        run: >-
          cp "release/知乎助手-${PACKAGE_VERSION}-mac.7z" "${RELEASE_BINARY}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mac-${{ steps.get-version-from-package-json.outputs.packageVersion }}
          RELEASE_TITLE: mac-${{ steps.get-version-from-package-json.outputs.packageVersion }}
          RELEASE_NOTES: Corresponding source is attached beside the binary for license compliance.
        run: >-
          gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
          --draft --prerelease
      - name: Upload corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mac-${{ steps.get-version-from-package-json.outputs.packageVersion }}
          SOURCE_BUNDLE: ${{ runner.temp }}/zhihuhelp-source/zhihuhelp-${{ steps.get-version-from-package-json.outputs.packageVersion }}-corresponding-source.tar.gz
        run: >-
          gh release upload "${RELEASE_TAG}" "${SOURCE_BUNDLE}" --repo "${GITHUB_REPOSITORY}"
      - name: Upload corresponding source checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mac-${{ steps.get-version-from-package-json.outputs.packageVersion }}
          SOURCE_CHECKSUM: ${{ runner.temp }}/zhihuhelp-source/zhihuhelp-${{ steps.get-version-from-package-json.outputs.packageVersion }}-corresponding-source.tar.gz.sha256
        run: >-
          gh release upload "${RELEASE_TAG}" "${SOURCE_CHECKSUM}" --repo "${GITHUB_REPOSITORY}"
      - name: Upload macOS binary after source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mac-${{ steps.get-version-from-package-json.outputs.packageVersion }}
          RELEASE_BINARY: ${{ runner.temp }}/mac-zhihuhelp-${{ steps.get-version-from-package-json.outputs.packageVersion }}.7z
        run: >-
          gh release upload "${RELEASE_TAG}" "${RELEASE_BINARY}" --repo "${GITHUB_REPOSITORY}"
